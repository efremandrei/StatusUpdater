plugins { id 'com.android.application' }

android {
    namespace 'com.efremandrei.statusupdater'
    compileSdk 35
    defaultConfig {
        applicationId 'com.efremandrei.statusupdater'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('STATUSUPDATER_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/statusupdater-release.jks")
            storePassword System.getenv('STATUSUPDATER_STORE_PASSWORD')
            keyAlias 'statusupdater'
            keyPassword System.getenv('STATUSUPDATER_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
